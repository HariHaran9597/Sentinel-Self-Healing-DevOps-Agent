name: sentinel

services:
  demo-server:
    build: ./demo-server
    container_name: demo-server
    labels:
      com.hariharan.sentinel.managed: "true"
    restart: "no"           # when it crashes it stays down -- Sentinel brings it back
    ports:
      - "127.0.0.1:${SENTINEL_DEMO_PORT:-18080}:8080"
    volumes:
      - applogs:/var/log/app
      - demo_state:/state
    environment:
      LOG_PATH: /var/log/app/app.log
      DEMO_STATE_FILE: /state/state.json
      DEPENDENCY_URL: http://sentinel-dependency:8090
    depends_on:
      - dependency

  dependency:
    build: ./dependency-server
    container_name: sentinel-dependency
    labels:
      com.hariharan.sentinel.managed: "true"
    restart: "no"

  agent:
    build: ./agent
    container_name: sentinel-agent
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SENTINEL_AGENT_PORT:-18000}:8000"
    volumes:
      - applogs:/var/log/app            # watch the same log the service writes
      - chroma_data:/data/chroma        # persistent vector store
      - sentinel_data:/data             # durable incidents and audit timeline
      - demo_state:/state               # isolated scenario state; never edits host files
      - /var/run/docker.sock:/var/run/docker.sock   # remediates via the Docker API
    environment:
      LOG_PATH: /var/log/app/app.log
      RUNBOOKS_DIR: /app/runbooks
      CHROMA_PATH: /data/chroma
      DATABASE_PATH: /data/sentinel.sqlite3
      DEMO_STATE_FILE: /state/state.json
      EXECUTOR_MODE: docker
      TARGET_CONTAINER: demo-server
      DEPENDENCY_CONTAINER: sentinel-dependency
      DEMO_SERVER_URL: http://demo-server:8080
      TARGET_HEALTH_URL: http://demo-server:8080/health
      EVALUATION_MODE: "true"
      REQUIRE_APPROVAL: "true"
      COOLDOWN_SECONDS: ${COOLDOWN_SECONDS:-30}
      # Optional evidence-grounded Groq second opinion; never required to run:
      LLM_DIAGNOSIS_ENABLED: ${LLM_DIAGNOSIS_ENABLED:-false}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
    depends_on:
      - demo-server

volumes:
  applogs:
  chroma_data:
  sentinel_data:
  demo_state:
