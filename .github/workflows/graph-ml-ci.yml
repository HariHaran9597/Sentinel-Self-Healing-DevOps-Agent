name: Graph-ML CI

on:
  push:
    branches: [main]
    paths: ["Graph-ML/**"]
  pull_request:
    branches: [main]
    paths: ["Graph-ML/**"]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: Graph-ML/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Graph-ML/requirements-dev.txt

      - name: Generate synthetic data
        working-directory: Graph-ML
        run: python scripts/generate_data.py

      - name: Run tests
        working-directory: Graph-ML
        run: python -m pytest tests -q --tb=short

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build fraudgraph-api image
        run: docker build -t fraudgraph-api ./Graph-ML

      - name: Verify image exists
        run: docker images fraudgraph-api --format '{{.Repository}}:{{.Tag}} {{.Size}}'
