name: Sentinel CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: agent/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements-dev.txt

      - name: Run tests
        working-directory: agent
        run: python -m pytest tests -q --tb=short

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build agent image
        run: docker build -t sentinel-agent ./agent

      - name: Build demo-server image
        run: docker build -t demo-server ./demo-server

      - name: Build dependency-server image
        run: docker build -t sentinel-dependency ./dependency-server

      - name: Verify images exist
        run: |
          docker images sentinel-agent --format '{{.Repository}}:{{.Tag}} {{.Size}}'
          docker images demo-server --format '{{.Repository}}:{{.Tag}} {{.Size}}'
          docker images sentinel-dependency --format '{{.Repository}}:{{.Tag}} {{.Size}}'
